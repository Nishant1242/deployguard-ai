name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format checks
        run: ruff format --check .

      - name: Run tests with coverage
        run: python -m pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_ARCHIVE_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download="/tmp/${archive}"
          install_dir="/tmp/gitleaks-${GITLEAKS_VERSION}"

          curl --fail --show-error --silent --location \
            --output "${download}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          echo "${GITLEAKS_ARCHIVE_SHA256}  ${download}" | sha256sum --check

          mkdir -p "${install_dir}"
          tar -xzf "${download}" -C "${install_dir}" gitleaks
          chmod +x "${install_dir}/gitleaks"
          "${install_dir}/gitleaks" version

      - name: Scan full Git history for secrets
        shell: bash
        run: |
          "/tmp/gitleaks-${GITLEAKS_VERSION}/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --verbose \
            --no-banner \
            .
