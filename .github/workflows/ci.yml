name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://deployguard:deployguard@localhost:5432/deployguard_test
      TEST_DATABASE_URL: postgresql+psycopg://deployguard:deployguard@localhost:5432/deployguard_test

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Initialize restricted PostgreSQL test database
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os

          import psycopg


          admin_url = os.environ["POSTGRES_ADMIN_URL"]

          with psycopg.connect(
              admin_url,
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      CREATE ROLE deployguard
                      LOGIN
                      NOSUPERUSER
                      NOCREATEDB
                      NOCREATEROLE
                      NOREPLICATION
                      NOBYPASSRLS
                      PASSWORD 'deployguard'
                      """
                  )
                  cursor.execute(
                      """
                      CREATE DATABASE deployguard_test
                      OWNER deployguard
                      """
                  )

          test_admin_url = (
              admin_url.rsplit("/", maxsplit=1)[0]
              + "/deployguard_test"
          )

          with psycopg.connect(
              test_admin_url,
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "REVOKE CREATE ON SCHEMA public FROM PUBLIC"
                  )
                  cursor.execute(
                      """
                      GRANT USAGE, CREATE
                      ON SCHEMA public
                      TO deployguard
                      """
                  )

          print(
              "Restricted PostgreSQL test database initialized."
          )
          PY

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format checks
        run: ruff format --check .

      - name: Run tests with coverage
        run: python -m pytest

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Audit runtime and development dependencies
        run: |
          python -m pip_audit \
            --requirement backend/requirements-dev.txt \
            --strict \
            --progress-spinner off

  static-security-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Scan production Python code with Bandit
        run: python -m bandit -r backend/app

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_ARCHIVE_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

    steps:
      - name: Check out full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download="/tmp/${archive}"
          install_dir="/tmp/gitleaks-${GITLEAKS_VERSION}"

          curl --fail --show-error --silent --location \
            --output "${download}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          echo "${GITLEAKS_ARCHIVE_SHA256}  ${download}" | sha256sum --check

          mkdir -p "${install_dir}"
          tar -xzf "${download}" -C "${install_dir}" gitleaks
          chmod +x "${install_dir}/gitleaks"
          "${install_dir}/gitleaks" version

      - name: Scan full Git history for secrets
        shell: bash
        run: |
          "/tmp/gitleaks-${GITLEAKS_VERSION}/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --verbose \
            --no-banner \
            .
