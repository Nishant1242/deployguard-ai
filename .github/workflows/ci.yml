name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.14
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format checks
        run: ruff format --check .

      - name: Run tests with coverage
        run: python -m pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
